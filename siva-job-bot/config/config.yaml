# Siva Job Bot - Main Configuration
# ===================================

# Personal Info
personal:
  name: "Siva"
  first_name: "Siva"
  last_name: ""           # REQUIRED: Your last name
  email: ""               # REQUIRED: Your email address
  phone: ""               # REQUIRED: Your phone number (e.g., "+1-XXX-XXX-XXXX")
  location: "Dallas-Fort Worth, TX"
  city: "Dallas"
  state: "TX"
  zip_code: ""            # REQUIRED: Your zip code
  country: "United States"
  linkedin_url: ""        # REQUIRED: Your LinkedIn profile URL
  github_url: ""          # Your GitHub profile URL
  website: ""             # Your portfolio/website URL
  current_company: ""
  resume_path: ""         # REQUIRED: Path to your resume PDF (e.g., "data/resume.pdf")

# Job Search Preferences
search:
  keywords:
    include: ["software engineer", "developer", "python", "full stack"]
    exclude: ["senior staff", "principal", "director", "VP", "lead architect"]
  locations: ["Dallas, TX", "Remote"]
  remote_only: false
  experience_levels: ["entry", "mid", "senior"]
  salary_min: 80000
  posted_within_hours: 24
  job_types: ["full_time", "contract"]
  companies:
    blacklist: []
    whitelist: []
  title_blacklist: []
  description_bad_words: ["US Citizen only", "security clearance required"]

# Platforms
platforms:
  linkedin:
    enabled: true
    easy_apply_only: true
    username: ""
    password: ""
  indeed:
    enabled: false
    username: ""
    password: ""
  greenhouse:
    enabled: false
  lever:
    enabled: false
  workday:
    enabled: false
  smartrecruiters:
    enabled: false
  icims:
    enabled: false
  taleo:
    enabled: false
  adp:
    enabled: false
  ashby:
    enabled: false

# Direct Application URLs (auto-detects ATS platform)
application_urls: []
  # - "https://boards.greenhouse.io/company/jobs/12345"
  # - "https://jobs.lever.co/company/job-id"
  # - "https://company.wd5.myworkdayjobs.com/en-US/careers/job/title/JR-12345"

# Company Career Boards (API-based job discovery - no Selenium needed)
company_boards: []
  # - platform: greenhouse
  #   token: "airbnb"           # from boards.greenhouse.io/{token}
  # - platform: lever
  #   token: "stripe"           # from jobs.lever.co/{token}
  #   team: "Engineering"       # optional team filter

# AI Settings - DeepSeek Only
ai:
  deepseek_api_key: ""  # Get from https://platform.deepseek.com
  deepseek_base_url: "https://api.deepseek.com/v1"
  models:
    scoring: "deepseek-chat"
    form_filling: "deepseek-chat"
    resume: "deepseek-chat"
    cover_letter: "deepseek-chat"
    reasoning: "deepseek-reasoner"
  temperature: 0.3
  max_retries: 3
  cache_responses: true
  resume_tailoring: true
  cover_letter: true
  job_scoring_threshold: 0.6

# CAPTCHA Solving (optional)
captcha:
  capsolver_api_key: ""    # CapSolver (cheapest: $0.60-1.20/1K solves)
  twocaptcha_api_key: ""   # 2Captcha (most reliable: $2.70-3.50/1K solves)

# Proxy (optional - for IP rotation)
proxy:
  url: ""  # e.g., "socks5://user:pass@proxy.example.com:1080"

# Safety & Anti-Detection
safety:
  max_applications_per_day: 30  # Conservative default (LinkedIn hard limit: 50)
  delay_between_apps_seconds: [45, 180]
  session_break_after: 15
  session_break_minutes: [5, 15]
  active_hours: ["08:00", "22:00"]
  dry_run: true  # Start in dry-run mode for safety
  pause_before_submit: false
  conservative_mode: true

# Notifications
notifications:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    sender_email: ""
    sender_password: ""
    recipient_email: ""
    daily_digest: true

# Database
database:
  path: "data/applications.db"
  export_csv: true
